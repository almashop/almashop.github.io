<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <!-- Memanggil library html5-qrcode dari CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        #result-container {
            margin-top: 20px;
            padding: 15px;
            width: 100%;
            max-width: 470px;
            background-color: #e6ffe6;
            border: 2px solid #4caf50;
            border-radius: 8px;
            text-align: center;
            display: none; /* Disembunyikan sampai ada hasil */
        }
        #result-text {
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
            word-break: break-all;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
    </style>
</head>
<body>

    <h2>Scan QR Code</h2>
    
    <!-- Tempat kamera akan ditampilkan -->
    <div id="reader"></div>

    <!-- Tempat hasil scan akan ditampilkan -->
    <div id="result-container">
        <p>Hasil Scan:</p>
        <p id="result-text"></p>
        <button onclick="window.location.reload()">Scan Lagi</button>
    </div>

    <script>
        // Fungsi yang dipanggil ketika QR Code berhasil terbaca
        function onScanSuccess(decodedText, decodedResult) {
            // Sembunyikan scanner
            document.getElementById('reader').style.display = 'none';
            
            // Tampilkan hasil
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('result-text').innerText = decodedText;

            // Hentikan proses scanning untuk menghemat baterai
            html5QrcodeScanner.clear();
        }

        // Fungsi yang dipanggil jika gagal membaca (biasanya diabaikan agar terus mencari QR)
        function onScanFailure(error) {
            // console.warn(`Code scan error = ${error}`);
        }

        // Konfigurasi Scanner
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { 
                fps: 10, // Frame per second
                qrbox: {width: 250, height: 250} // Ukuran kotak panduan scan
            },
            /* verbose= */ false
        );

        // Memulai scanner
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>
