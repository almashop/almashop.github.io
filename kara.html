<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Karaoke Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #07050c;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        #player-stage:fullscreen,
        #player-stage:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            background: #000;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">

    <!-- Fullscreen Video Stage -->
    <main id="player-stage" class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
        <!-- YouTube IFrame Target -->
        <div id="yt-player" class="w-full h-full"></div>

        <!-- Standby Overlay -->
        <div id="standby-screen" class="absolute inset-0 bg-gradient-to-br from-[#1b0e33] via-[#0d0718] to-black flex flex-col items-center justify-center text-center p-6 z-10">
            <div class="w-24 h-24 rounded-3xl bg-purple-600/20 border border-purple-400/30 flex items-center justify-center text-amber-300 mb-5 shadow-2xl">
                <i class="fa-solid fa-microphone-lines text-4xl"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">KARAOKE<span class="text-amber-300"></span> DISPLAY</h1>
            <p class="text-purple-200/75 text-sm max-w-md mt-2">
                Siap memutar antrean. Tambahkan lagu melalui halaman <span class="text-amber-300 font-semibold">index.html</span>.
            </p>
        </div>

        <!-- Floating Top Bar -->
        <div class="absolute top-3 inset-x-3 flex items-center justify-between z-20 pointer-events-none">
            <div class="pointer-events-auto bg-black/65 backdrop-blur-md border border-white/10 px-3.5 py-1.5 rounded-full flex items-center gap-2 text-xs">
                <span id="player-sync-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span id="player-sync-text" class="text-slate-200 font-medium">Connected</span>
            </div>

            <div class="pointer-events-auto flex items-center gap-2">
                <a href="index.html" class="bg-black/65 hover:bg-purple-900/80 backdrop-blur-md border border-white/10 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-mobile-screen"></i>
                </a>
                <button onclick="toggleFullscreenLandscape()" class="bg-[#5e35b1] hover:bg-[#6d3cc2] active:scale-95 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-1.5 transition">
                    <i id="fs-icon" class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>

        <!-- Toast Alert -->
        <div id="player-toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 bg-rose-950/95 border border-rose-500/60 text-rose-100 px-4 py-2 rounded-2xl text-xs font-semibold shadow-2xl z-30">
            Pesan status
        </div>
    </main>

    <!-- Bottom Info & Quick Controls Bar -->
    <footer class="bg-[#120b21] border-t border-purple-900/50 px-4 py-3 flex items-center justify-between gap-4 z-20">
        <div class="min-w-0 flex-1">
            <span class="text-[10px] font-bold uppercase tracking-wider text-amber-300 block">Sedang Diputar</span>
            <h2 id="current-song-title" class="text-sm md:text-base font-bold text-white truncate">Tidak Ada Lagu</h2>
        </div>

        <div class="hidden sm:block text-right max-w-xs">
            <span class="text-[10px] uppercase tracking-wider text-purple-300/70 block">Berikutnya</span>
            <p id="next-song-title" class="text-xs text-slate-300 truncate">-</p>
        </div>

        <div class="flex items-center gap-2 flex-shrink-0">
            <button onclick="consumeAndPlayNext()" class="bg-white/10 hover:bg-white/20 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
                <span>Skip & Hapus</span>
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>
    </footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const JSONBIN_ID = '6b00350dffd5d16053d0f8f2';
        const JSONBIN_KEY = '$2a$10$V.OboC87dzzE6UjcNPtp6.5IM/o52syCC3x1D44TbjiXInMVdjm/W';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

        const syncChannel = new BroadcastChannel('karaoke_ovo_sync');

        let player = null;
        let isYTReady = false;
        let lastLoadedVideoId = null;
        let lastCommandNonce = null;
        let isPushing = false;
        let isAdvancing = false;

        let state = {
            queue: [],
            currentIndex: -1,
            isPlaying: false,
            lastCommand: null,
            updatedAt: 0
        };

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    fs: 1
                },
                events: {
                    onReady: () => {
                        isYTReady = true;
                        applyPlaybackFromState(true);
                    },
                    onStateChange: handlePlayerStateChange,
                    onError: () => {
                        showToast('Video terblokir/error. Dihapus dari antrean & lanjut...');
                        consumeAndPlayNext();
                    }
                }
            });
        }

        function handlePlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                consumeAndPlayNext();
            } else if (event.data === YT.PlayerState.PLAYING && !state.isPlaying) {
                state.isPlaying = true;
                syncStateToBin();
            } else if (event.data === YT.PlayerState.PAUSED && state.isPlaying) {
                state.isPlaying = false;
                syncStateToBin();
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await pullState(true);
            setInterval(() => pullState(false), 2500);
            document.addEventListener('fullscreenchange', onFullscreenChanged);
            document.addEventListener('webkitfullscreenchange', onFullscreenChanged);
        });

        syncChannel.onmessage = (event) => {
            if (event.data && event.data.type === 'STATE_UPDATE') {
                if ((event.data.payload.updatedAt || 0) >= (state.updatedAt || 0)) {
                    state = { ...state, ...event.data.payload };
                    onStateArrived();
                }
            }
        };

        async function pullState(isInitial = false) {
            if (isPushing || isAdvancing) return;
            try {
                const res = await fetch(`${JSONBIN_URL}/latest`, {
                    headers: {
                        'X-Master-Key': JSONBIN_KEY,
                        'X-Access-Key': JSONBIN_KEY
                    }
                });
                if (!res.ok) throw new Error('Failed pull');
                const json = await res.json();
                const rec = json.record || {};

                if (isInitial || (rec.updatedAt || 0) > (state.updatedAt || 0)) {
                    state = {
                        queue: Array.isArray(rec.queue) ? rec.queue : [],
                        currentIndex: typeof rec.currentIndex === 'number' ? rec.currentIndex : -1,
                        isPlaying: Boolean(rec.isPlaying),
                        lastCommand: rec.lastCommand || null,
                        updatedAt: rec.updatedAt || Date.now()
                    };
                    onStateArrived();
                }
                setConnBadge(true);
            } catch (e) {
                setConnBadge(false);
            }
        }

        async function syncStateToBin() {
            state.updatedAt = Date.now();
            syncChannel.postMessage({ type: 'STATE_UPDATE', payload: state });
            isPushing = true;
            try {
                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_KEY,
                        'X-Access-Key': JSONBIN_KEY
                    },
                    body: JSON.stringify(state)
                });
            } catch (e) {
                console.error(e);
            } finally {
                setTimeout(() => { isPushing = false; }, 400);
            }
        }

        function setConnBadge(ok) {
            const dot = document.getElementById('player-sync-dot');
            const text = document.getElementById('player-sync-text');
            if (ok) {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                text.innerText = 'Connected';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-amber-400';
                text.innerText = 'Sync Retry...';
            }
        }

        function onStateArrived() {
            renderFooterInfo();
            applyPlaybackFromState(false);
        }

        function renderFooterInfo() {
            const currentEl = document.getElementById('current-song-title');
            const nextEl = document.getElementById('next-song-title');
            const standby = document.getElementById('standby-screen');

            const idx = state.currentIndex >= 0 ? state.currentIndex : (state.queue.length > 0 ? 0 : -1);
            const current = idx >= 0 ? state.queue[idx] : null;
            const next = idx >= 0 ? state.queue[idx + 1] : null;

            if (current) {
                currentEl.innerText = current.title;
                standby.classList.add('hidden');
            } else {
                currentEl.innerText = 'Tidak Ada Lagu';
                standby.classList.remove('hidden');
                lastLoadedVideoId = null;
                if (isYTReady && player && typeof player.stopVideo === 'function') {
                    player.stopVideo();
                }
            }

            nextEl.innerText = next ? next.title : 'Akhir Antrean';
        }

        function applyPlaybackFromState(forceReload) {
            if (!isYTReady || !player) return;

            if (!Array.isArray(state.queue) || state.queue.length === 0) {
                lastLoadedVideoId = null;
                if (typeof player.stopVideo === 'function') player.stopVideo();
                return;
            }

            const safeIndex = (state.currentIndex >= 0 && state.currentIndex < state.queue.length)
                ? state.currentIndex
                : 0;
            state.currentIndex = safeIndex;
            const current = state.queue[safeIndex];
            if (!current) return;

            const cmd = state.lastCommand;
            const isNewCommand = cmd && cmd.nonce && cmd.nonce !== lastCommandNonce;

            if (isNewCommand) {
                lastCommandNonce = cmd.nonce;
                if (cmd.action === 'stop') {
                    lastLoadedVideoId = null;
                    player.stopVideo();
                    return;
                }
                if (cmd.action === 'togglePlay') {
                    if (state.isPlaying) player.playVideo();
                    else player.pauseVideo();
                    return;
                }
                if (cmd.action === 'playIndex') {
                    lastLoadedVideoId = current.videoId;
                    player.loadVideoById(current.videoId);
                    return;
                }
            }

            if (forceReload || current.videoId !== lastLoadedVideoId) {
                lastLoadedVideoId = current.videoId;
                if (state.isPlaying) {
                    player.loadVideoById(current.videoId);
                } else {
                    player.cueVideoById(current.videoId);
                }
            }
        }

        // Hapus lagu yang selesai diputar dari antrean & langsung putar berikutnya
        async function consumeAndPlayNext() {
            if (isAdvancing) return;
            if (!Array.isArray(state.queue) || state.queue.length === 0) return;

            isAdvancing = true;
            try {
                const removeIdx = (state.currentIndex >= 0 && state.currentIndex < state.queue.length)
                    ? state.currentIndex
                    : 0;

                state.queue.splice(removeIdx, 1);

                if (state.queue.length > 0) {
                    state.currentIndex = 0;
                    state.isPlaying = true;
                    const nextSong = state.queue[0];
                    const nonce = Date.now();
                    state.lastCommand = { action: 'playIndex', index: 0, videoId: nextSong.videoId, nonce };
                    lastCommandNonce = nonce;
                    lastLoadedVideoId = nextSong.videoId;

                    renderFooterInfo();
                    if (isYTReady && player) {
                        player.loadVideoById(nextSong.videoId);
                    }
                } else {
                    state.currentIndex = -1;
                    state.isPlaying = false;
                    const nonce = Date.now();
                    state.lastCommand = { action: 'stop', nonce };
                    lastCommandNonce = nonce;
                    lastLoadedVideoId = null;

                    renderFooterInfo();
                    if (isYTReady && player && typeof player.stopVideo === 'function') {
                        player.stopVideo();
                    }
                }

                await syncStateToBin();
            } finally {
                setTimeout(() => { isAdvancing = false; }, 500);
            }
        }

        // Fullscreen + Auto Landscape
        async function toggleFullscreenLandscape() {
            const stage = document.getElementById('player-stage');
            const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);

            try {
                if (!isFs) {
                    if (stage.requestFullscreen) {
                        await stage.requestFullscreen();
                    } else if (stage.webkitRequestFullscreen) {
                        stage.webkitRequestFullscreen();
                    }
                    await lockLandscapeOrientation();
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    unlockOrientationSafe();
                }
            } catch (err) {
                console.warn('Fullscreen/Orientation error:', err);
                showToast('Gunakan tombol fullscreen browser atau rotasi perangkat ke landscape.');
            }
        }

        async function lockLandscapeOrientation() {
            try {
                if (screen.orientation && typeof screen.orientation.lock === 'function') {
                    await screen.orientation.lock('landscape');
                }
            } catch (e) {}
        }

        function unlockOrientationSafe() {
            try {
                if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                    screen.orientation.unlock();
                }
            } catch (e) {}
        }

        function onFullscreenChanged() {
            const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
            const icon = document.getElementById('fs-icon');
            const label = document.getElementById('fs-label');

            if (isFs) {
                icon.className = 'fa-solid fa-compress';
                label.innerText = 'Keluar Fullscreen';
                lockLandscapeOrientation();
            } else {
                icon.className = 'fa-solid fa-expand';
                label.innerText = 'Fullscreen Landscape';
                unlockOrientationSafe();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('player-toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3200);
        }
    </script>
</body>
</html>
