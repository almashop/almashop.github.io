<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube Web Player - Kids & Shorts</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            overflow-x: hidden;
            width: 100vw;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tombol Hamburger */
        .menu-toggle {
            background: none;
            border: none;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            z-index: 1100;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #f1f1f1;
            border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            color: #fff;
            text-decoration: none;
        }

        .logo i {
            color: #ff0000;
            font-size: 20px;
        }

        /* Search Box dengan Tombol Clear (X) */
        .search-container {
            display: flex;
            flex-grow: 1;
            max-width: 500px;
            margin: 0 8px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            padding: 0 12px;
            width: 100%;
            height: 38px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 13px;
            padding-right: 24px;
        }

        .clear-search-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .clear-search-btn:hover {
            color: #fff;
            background: #333;
        }

        .search-btn {
            background: #222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            width: 44px;
            height: 38px;
            cursor: pointer;
            color: #aaa;
            font-size: 13px;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: #333;
            color: #fff;
        }

        /* Main Container */
        .main-container {
            display: flex;
            margin-top: 56px;
            min-height: calc(100vh - 56px);
            position: relative;
            width: 100%;
        }

        /* Sidebar Responsive */
        sidebar {
            position: fixed;
            top: 56px;
            left: -240px;
            width: 240px;
            height: calc(100vh - 56px);
            background-color: #0f0f0f;
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 999;
            transition: left 0.3s ease-in-out;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        sidebar.open {
            left: 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #f1f1f1;
            text-decoration: none;
            margin-bottom: 4px;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: #272727;
        }

        .sidebar-item i {
            font-size: 18px;
            width: 24px;
        }

        hr {
            border: none;
            border-top: 1px solid #3f3f3f;
            margin: 12px 0;
        }

        .sidebar-section-title {
            font-size: 12px;
            color: #aaa;
            padding: 6px 12px;
            font-weight: 500;
        }

        /* Content Area */
        .content {
            flex-grow: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 100%;
            margin-left: 0;
            transition: margin-left 0.3s ease-in-out;
        }

        @media (min-width: 769px) {
            sidebar.open ~ .content {
                margin-left: 240px;
            }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 {
            font-size: 16px;
            font-weight: 500;
            line-height: 22px;
        }

        /* Video Grid Responsive */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
            width: 100%;
        }

        /* Khusus Grid Shorts (Tampilan Vertikal) */
        .video-grid.shorts-grid {
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        }
        .video-grid.shorts-grid .thumbnail-container {
            aspect-ratio: 9/16;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .video-details h3 {
            font-size: 13px;
            font-weight: 500;
            color: #f1f1f1;
            line-height: 18px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-details p {
            font-size: 11px;
            color: #aaa;
            margin-top: 3px;
        }

        .btn-options {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
        }

        /* Playlist Grid View */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .playlist-card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .playlist-card-cover {
            width: 100%;
            aspect-ratio: 16/9;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 24px;
        }

        .playlist-card-info {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .playlist-card-info h4 {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .playlist-card-info p {
            font-size: 11px;
            color: #aaa;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 16px;
        }

        .modal-box {
            background: #212121;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .modal-box h3 {
            margin-bottom: 14px;
            font-size: 16px;
        }

        .modal-box input {
            width: 100%;
            padding: 10px 12px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .modal-buttons button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }

        .btn-cancel { background: transparent; color: #aaa; }
        .btn-submit { background: #3ea6ff; color: #0f0f0f; }

        /* Watch Container */
        .watch-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .watch-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        @media (min-width: 900px) {
            .watch-layout {
                display: grid;
                grid-template-columns: 1fr 340px;
                gap: 20px;
                max-width: 1100px;
                margin: 0 auto;
            }
        }

        .player-main-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            position: relative;
        }

        /* Tombol Kustom Fullscreen Auto-Landscape di HP */
        .custom-fullscreen-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            z-index: 50;
            font-size: 14px;
        }
        .custom-fullscreen-btn:hover {
            background: rgba(50, 50, 50, 0.9);
        }

        .player-wrapper {
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }

        #youtube-player {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        .player-meta h3 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 3px;
            line-height: 20px;
        }

        .player-meta p {
            color: #aaa;
            font-size: 12px;
        }

        .queue-sidebar-panel {
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .queue-sidebar-panel::-webkit-scrollbar {
            width: 4px;
        }
        .queue-sidebar-panel::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            background: #212121;
        }

        .playlist-item:hover {
            background: #333;
        }

        .playlist-item.active {
            background: #3f3f3f;
            color: #3ea6ff;
        }

        .playlist-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .playlist-item img {
            width: 50px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .header-right .fa-video, 
            .header-right .fa-bell {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="#" class="logo" id="logo-home"><i class="fab fa-youtube"></i>YouTube</a>
        </div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Telusuri...">
                <button class="clear-search-btn" id="clear-search-btn" title="Hapus teks"><i class="fas fa-times-circle"></i></button>
            </div>
            <button class="search-btn" id="search-submit"><i class="fas fa-search"></i></button>
        </div>
        <div class="header-right">
            <i class="fas fa-video" style="cursor:pointer; font-size: 15px;"></i>
            <i class="fas fa-bell" style="cursor:pointer; font-size: 15px;"></i>
            <div class="channel-avatar" style="width: 26px; height: 26px; background:#555; border-radius:50%;"></div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <sidebar id="sidebar">
            <a href="#" class="sidebar-item active" id="nav-home"><i class="fas fa-home"></i>Beranda</a>
            <a href="#" class="sidebar-item" id="nav-shorts"><i class="fas fa-bolt"></i>Shorts</a>
            <a href="#" class="sidebar-item"><i class="fas fa-subscriptions"></i>Subscription</a>
            <hr>
            <a href="#" class="sidebar-item" id="nav-history"><i class="fas fa-history"></i>Histori</a>
            <a href="#" class="sidebar-item"><i class="fas fa-play-circle"></i>Video Anda</a>
            <a href="#" class="sidebar-item" id="nav-clock"><i class="fas fa-clock"></i>Tonton Nanti</a>
            <hr>
            <div class="sidebar-section-title">DAFTAR PUTAR</div>
            <a href="#" class="sidebar-item" id="nav-playlists"><i class="fas fa-list"></i>Semua Playlist</a>
            <a href="#" class="sidebar-item" id="nav-create-playlist"><i class="fas fa-plus-circle"></i>Buat Playlist Baru</a>
        </sidebar>

        <!-- Dynamic Content Area -->
        <div class="content" id="main-content-area">
            <!-- Tampilan Beranda / List Video -->
            <div id="home-view" style="display: flex; flex-direction: column; gap: 14px; width: 100%;">
                <div class="section-header">
                    <h2 id="home-section-title">Video Berdasarkan Riwayat Pencarian</h2>
                </div>
                <div class="video-grid" id="video-grid"></div>
            </div>

            <!-- Tampilan Halaman Nonton Video -->
            <div class="watch-container" id="watch-container">
                <div class="watch-layout">
                    <div class="player-main-area">
                        <div class="player-wrapper" id="player-container-box">
                            <div id="youtube-player"></div>
                            <!-- Tombol Fullscreen Paksa Landscape -->
                            <button class="custom-fullscreen-btn" id="btn-force-landscape" title="Layar Penuh Lanskap"><i class="fas fa-expand"></i></button>
                        </div>
                        <div class="player-meta">
                            <h3 id="watch-meta-title">Judul Video</h3>
                            <p id="watch-meta-channel">Nama Channel</p>
                        </div>
                    </div>
                    <div>
                        <h4 style="font-size: 13px; margin-bottom: 6px; color: #aaa; font-weight: 500;">Daftar Putar Antrean</h4>
                        <div class="queue-sidebar-panel" id="playlist-queue-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Buat Playlist Baru -->
    <div class="modal-overlay" id="modal-create-playlist">
        <div class="modal-box">
            <h3>Buat Playlist Baru</h3>
            <input type="text" id="playlist-name-input" placeholder="Nama Playlist...">
            <div class="modal-buttons">
                <button class="btn-submit" id="modal-create-btn">Buat</button>
                <button class="btn-cancel" id="modal-cancel-btn">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal Pilih Playlist saat video ingin ditambahkan -->
    <div class="modal-overlay" id="modal-add-to-playlist">
        <div class="modal-box">
            <h3>Simpan video ke...</h3>
            <div id="modal-playlist-options" style="max-height: 140px; overflow-y: auto; margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px;"></div>

            <div class="modal-buttons">
                <button class="btn-submit" id="modal-confirm-save-btn"><i class="fas fa-plus"></i> Simpan</button>
                <button class="btn-cancel" id="modal-add-cancel-btn">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        const YT_API_KEY = "AIzaSyDgu2BS4TTqCPNJV6GgkkHr7k9IzLIActo";

        let currentVideosList = [];
        let queuePlaylist = [];
        let currentIndex = 0;
        let player;

        let watchHistory = JSON.parse(localStorage.getItem('yt_watch_history_items')) || [];
        let searchKeywordsHistory = JSON.parse(localStorage.getItem('yt_search_keywords_history')) || ["lofi music", "pop songs"];

        function recordSearchKeyword(query) {
            if (!query.trim()) return;
            searchKeywordsHistory = searchKeywordsHistory.filter(k => k.toLowerCase() !== query.toLowerCase());
            searchKeywordsHistory.unshift(query);
            if (searchKeywordsHistory.length > 10) searchKeywordsHistory.pop();
            localStorage.setItem('yt_search_keywords_history', JSON.stringify(searchKeywordsHistory));
        }

        function recordVideoWatch(videoObj) {
            if (!videoObj) return;
            watchHistory = watchHistory.filter(v => v.id !== videoObj.id);
            watchHistory.unshift(videoObj);
            if (watchHistory.length > 50) watchHistory.pop();
            localStorage.setItem('yt_watch_history_items', JSON.stringify(watchHistory));
        }

        let customPlaylists = JSON.parse(localStorage.getItem('yt_custom_playlists')) || [];

        function savePlaylists() {
            localStorage.setItem('yt_custom_playlists', JSON.stringify(customPlaylists));
        }

        let activeVideoToSave = null;
        let selectedPlaylistIndex = null;

        const menuToggleBtn = document.getElementById('menu-toggle-btn');
        const sidebar = document.getElementById('sidebar');

        menuToggleBtn.addEventListener('click', () => {
            menuToggleBtn.classList.toggle('active');
            sidebar.classList.toggle('open');
        });

        function closeSidebarMobile() {
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                menuToggleBtn.classList.remove('active');
            }
        }

        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');

        searchInput.addEventListener('input', () => {
            if (searchInput.value.trim().length > 0) {
                clearSearchBtn.style.display = 'flex';
            } else {
                clearSearchBtn.style.display = 'none';
            }
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            searchInput.focus();
        });

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {}

        function showView(viewName) {
            document.getElementById('home-view').style.display = (viewName === 'home') ? 'flex' : 'none';
            document.getElementById('watch-container').style.display = (viewName === 'watch') ? 'flex' : 'none';
            
            if (viewName !== 'watch' && player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
        }

        // Fitur Auto-Landscape Otomatis saat Tombol Fullscreen Diklik
        document.getElementById('btn-force-landscape').addEventListener('click', () => {
            const playerBox = document.getElementById('player-container-box');
            
            if (playerBox.requestFullscreen) {
                playerBox.requestFullscreen();
            } else if (playerBox.webkitRequestFullscreen) {
                playerBox.webkitRequestFullscreen();
            } else if (playerBox.msRequestFullscreen) {
                playerBox.msRequestFullscreen();
            }

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(err => {
                    console.log("Orientasi layar otomatis dibatasi oleh sistem browser:", err);
                });
            }
        });

        async function renderHomeView() {
            showView('home');
            const grid = document.getElementById('video-grid');
            grid.className = "video-grid";
            grid.innerHTML = `<p style="color: #aaa; font-size: 13px;">Memuat video...</p>`;

            const keywordToFetch = searchKeywordsHistory.length > 0 ? searchKeywordsHistory[0] : "lofi music";
            document.getElementById('home-section-title').innerText = `Rekomendasi: "${keywordToFetch}"`;

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(keywordToFetch)}&type=video&key=${YT_API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.items) {
                    const fetchedVideos = data.items.map(item => ({
                        id: item.id.videoId,
                        title: item.snippet.title,
                        channel: item.snippet.channelTitle,
                        category: keywordToFetch,
                        thumb: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                    }));
                    currentVideosList = fetchedVideos;
                    grid.innerHTML = "";

                    fetchedVideos.forEach((vid, index) => {
                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.innerHTML = `
                            <div class="thumbnail-container">
                                <img src="${vid.thumb}" alt="${vid.title}">
                            </div>
                            <div class="video-info">
                                <div style="display:flex; gap:8px; overflow:hidden;">
                                    <div style="width:28px; height:28px; background:#555; border-radius:50%; flex-shrink:0;"></div>
                                    <div class="video-details">
                                        <h3>${vid.title}</h3>
                                        <p>${vid.channel}</p>
                                    </div>
                                </div>
                                <button class="btn-options" title="Opsi" onclick="event.stopPropagation(); openAddToPlaylistModal('${vid.id}')">
                                    <i class="fas fa-ellipsis-vertical"></i>
                                </button>
                            </div>
                        `;
                        card.addEventListener('click', () => {
                            recordVideoWatch(vid);
                            queuePlaylist = [...fetchedVideos];
                            playVideo(vid, index);
                        });
                        grid.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Gagal memuat beranda:", error);
            }
        }

        // Fungsionalitas Menu Shorts Dibatasi Khusus: Lia Caca, Baby Bus, & Lagu Anak-anak
        async function renderShortsView() {
            showView('home');
            document.getElementById('home-section-title').innerText = "YouTube Shorts (Lia Caca, Baby Bus & Lagu Anak)";
            const grid = document.getElementById('video-grid');
            grid.className = "video-grid shorts-grid";
            grid.innerHTML = `<p style="color: #aaa; font-size: 13px;">Memuat konten anak dan shorts...</p>`;

            // Query rotasi khusus untuk channel/konten yang diminta
            const kidsQueries = ["lia caca shorts", "babybus shorts", "lagu anak anak shorts"];
            const randomQuery = kidsQueries[Math.floor(Math.random() * kidsQueries.length)];

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(randomQuery)}&type=video&key=${YT_API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.items) {
                    const shortsVideos = data.items.map(item => ({
                        id: item.id.videoId,
                        title: item.snippet.title,
                        channel: item.snippet.channelTitle,
                        category: "Shorts Anak",
                        thumb: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                    }));
                    currentVideosList = shortsVideos;
                    grid.innerHTML = "";

                    shortsVideos.forEach((vid, index) => {
                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.innerHTML = `
                            <div class="thumbnail-container">
                                <img src="${vid.thumb}" alt="${vid.title}">
                            </div>
                            <div class="video-info">
                                <div class="video-details" style="width:100%;">
                                    <h3 style="-webkit-line-clamp: 1;">${vid.title}</h3>
                                    <p>${vid.channel}</p>
                                </div>
                            </div>
                        `;
                        card.addEventListener('click', () => {
                            recordVideoWatch(vid);
                            queuePlaylist = [...shortsVideos];
                            playVideo(vid, index);
                        });
                        grid.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Gagal memuat shorts anak:", error);
                grid.innerHTML = `<p style="color: #aaa; font-size: 13px;">Gagal memuat konten anak.</p>`;
            }
        }

        function renderHistoryView() {
            showView('home');
            document.getElementById('home-section-title').innerText = "Histori Tontonan Anda";
            const grid = document.getElementById('video-grid');
            grid.className = "video-grid";
            grid.innerHTML = "";

            if (watchHistory.length === 0) {
                grid.innerHTML = `<p style="color: #aaa; font-size: 13px;">Belum ada video dalam histori.</p>`;
                return;
            }

            watchHistory.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${vid.thumb}" alt="${vid.title}">
                    </div>
                    <div class="video-info">
                        <div style="display:flex; gap:8px; overflow:hidden;">
                            <div style="width:28px; height:28px; background:#555; border-radius:50%; flex-shrink:0;"></div>
                            <div class="video-details">
                                <h3>${vid.title}</h3>
                                <p>${vid.channel}</p>
                            </div>
                        </div>
                        <button class="btn-options" title="Hapus dari Histori" onclick="event.stopPropagation(); removeHistoryItem('${vid.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                card.addEventListener('click', () => {
                    queuePlaylist = [...watchHistory];
                    playVideo(vid, index);
                });
                grid.appendChild(card);
            });
        }

        window.removeHistoryItem = function(videoId) {
            watchHistory = watchHistory.filter(v => v.id !== videoId);
            localStorage.setItem('yt_watch_history_items', JSON.stringify(watchHistory));
            renderHistoryView();
        };

        document.getElementById('logo-home').addEventListener('click', (e) => {
            e.preventDefault();
            renderHomeView();
            closeSidebarMobile();
        });

        document.getElementById('nav-home').addEventListener('click', (e) => {
            e.preventDefault();
            renderHomeView();
            closeSidebarMobile();
        });

        document.getElementById('nav-shorts').addEventListener('click', (e) => {
            e.preventDefault();
            renderShortsView();
            closeSidebarMobile();
        });

        document.getElementById('nav-history').addEventListener('click', (e) => {
            e.preventDefault();
            renderHistoryView();
            closeSidebarMobile();
        });

        document.getElementById('nav-playlists').addEventListener('click', (e) => {
            e.preventDefault();
            renderPlaylistsView();
            closeSidebarMobile();
        });

        document.getElementById('nav-create-playlist').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('modal-create-playlist').style.display = 'flex';
            document.getElementById('playlist-name-input').value = '';
            closeSidebarMobile();
        });

        function renderPlaylistsView() {
            showView('home');
            document.getElementById('home-section-title').innerText = "Daftar Playlist Anda";
            
            const mainArea = document.getElementById('home-view');
            document.getElementById('video-grid').innerHTML = "";
            
            let plContainer = document.getElementById('custom-playlist-wrapper');
            if (!plContainer) {
                plContainer = document.createElement('div');
                plContainer.id = 'custom-playlist-wrapper';
                plContainer.className = 'playlist-grid';
                mainArea.appendChild(plContainer);
            }
            plContainer.innerHTML = "";

            if (customPlaylists.length === 0) {
                plContainer.innerHTML = `<p style="color: #aaa; font-size: 13px;">Belum ada playlist.</p>`;
                return;
            }

            customPlaylists.forEach((pl, idx) => {
                const card = document.createElement('div');
                card.className = 'playlist-card';
                card.innerHTML = `
                    <div class="playlist-card-cover">
                        <i class="fas fa-list-ul"></i>
                    </div>
                    <div class="playlist-card-info">
                        <div>
                            <h4>${pl.name}</h4>
                            <p>${pl.videos.length} video</p>
                        </div>
                        <button class="btn-options" title="Hapus Playlist" onclick="event.stopPropagation(); deletePlaylist(${idx})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                card.addEventListener('click', () => {
                    renderSinglePlaylistDetail(pl);
                });
                plContainer.appendChild(card);
            });
        }

        function renderSinglePlaylistDetail(playlistObj) {
            showView('home');
            document.getElementById('home-section-title').innerText = `Playlist: ${playlistObj.name}`;
            const grid = document.getElementById('video-grid');
            grid.className = "video-grid";
            grid.innerHTML = "";
            
            const plContainer = document.getElementById('custom-playlist-wrapper');
            if (plContainer) plContainer.innerHTML = "";

            if (playlistObj.videos.length === 0) {
                grid.innerHTML = `<p style="color: #aaa; font-size: 13px;">Playlist kosong.</p>`;
                return;
            }

            playlistObj.videos.forEach((vid, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${vid.thumb}" alt="${vid.title}">
                    </div>
                    <div class="video-info">
                        <div style="display:flex; gap:8px; overflow:hidden;">
                            <div style="width:28px; height:28px; background:#555; border-radius:50%; flex-shrink:0;"></div>
                            <div class="video-details">
                                <h3>${vid.title}</h3>
                                <p>${vid.channel}</p>
                            </div>
                        </div>
                        <button class="btn-options" title="Hapus dari Playlist" onclick="event.stopPropagation(); removeVideoFromPlaylist('${playlistObj.name}', '${vid.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                card.addEventListener('click', () => {
                    recordVideoWatch(vid);
                    queuePlaylist = [...playlistObj.videos];
                    playVideo(vid, index);
                });
                grid.appendChild(card);
            });
        }

        document.getElementById('modal-create-btn').addEventListener('click', () => {
            const name = document.getElementById('playlist-name-input').value.trim();
            if (!name) return;

            customPlaylists.push({ id: 'pl_' + Date.now(), name: name, videos: [] });
            savePlaylists();
            document.getElementById('modal-create-playlist').style.display = 'none';
            renderPlaylistsView();
        });

        document.getElementById('modal-cancel-btn').addEventListener('click', () => {
            document.getElementById('modal-create-playlist').style.display = 'none';
        });

        window.openAddToPlaylistModal = function(videoId) {
            let foundVid = currentVideosList.find(v => v.id === videoId) || watchHistory.find(v => v.id === videoId);
            if (!foundVid) {
                for(let pl of customPlaylists) {
                    let v = pl.videos.find(item => item.id === videoId);
                    if(v) { foundVid = v; break; }
                }
            }
            activeVideoToSave = foundVid;
            selectedPlaylistIndex = null;

            const container = document.getElementById('modal-playlist-options');
            container.innerHTML = "";

            if (customPlaylists.length === 0) {
                container.innerHTML = `<p style="font-size:12px; color:#aaa;">Belum ada playlist.</p>`;
            } else {
                customPlaylists.forEach((pl, idx) => {
                    const isAlreadyIn = pl.videos.some(v => v.id === videoId);
                    const item = document.createElement('div');
                    item.className = 'playlist-option-row';
                    item.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#181818; padding:8px 10px; border-radius:6px; cursor:pointer; border: 1px solid transparent;";
                    item.innerHTML = `
                        <span style="font-size:12px;">${pl.name}</span>
                        <span style="font-size:11px; color: ${isAlreadyIn ? '#3ea6ff' : '#aaa'};">${isAlreadyIn ? 'Ada' : 'Pilih'}</span>
                    `;

                    item.addEventListener('click', () => {
                        document.querySelectorAll('.playlist-option-row').forEach(el => el.style.borderColor = 'transparent');
                        item.style.borderColor = '#3ea6ff';
                        selectedPlaylistIndex = idx;
                    });

                    container.appendChild(item);
                });
            }

            document.getElementById('modal-add-to-playlist').style.display = 'flex';
        };

        document.getElementById('modal-confirm-save-btn').addEventListener('click', () => {
            if (selectedPlaylistIndex === null) return;

            const targetPl = customPlaylists[selectedPlaylistIndex];
            const isAlreadyIn = targetPl.videos.some(v => v.id === activeVideoToSave.id);

            if (!isAlreadyIn && activeVideoToSave) {
                targetPl.videos.push(activeVideoToSave);
                savePlaylists();
                document.getElementById('modal-add-to-playlist').style.display = 'none';
            }
        });

        document.getElementById('modal-add-cancel-btn').addEventListener('click', () => {
            document.getElementById('modal-add-to-playlist').style.display = 'none';
        });

        window.deletePlaylist = function(index) {
            customPlaylists.splice(index, 1);
            savePlaylists();
            renderPlaylistsView();
        };

        window.removeVideoFromPlaylist = function(playlistName, videoId) {
            const pl = customPlaylists.find(p => p.name === playlistName);
            if (pl) {
                pl.videos = pl.videos.filter(v => v.id !== videoId);
                savePlaylists();
                renderSinglePlaylistDetail(pl);
            }
        };

        function playVideo(videoObj, index = 0) {
            currentIndex = index;
            showView('watch');

            document.getElementById('watch-meta-title').innerText = videoObj.title;
            document.getElementById('watch-meta-channel').innerText = videoObj.channel;

            renderPlaylistQueueUI();

            if (!player) {
                player = new YT.Player('youtube-player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoObj.id,
                    playerVars: { 
                        'autoplay': 1, 
                        'controls': 1,
                        'modestbranding': 1,
                        'rel': 0
                    },
                    events: { 
                        'onStateChange': onPlayerStateChange,
                        'onReady': onPlayerReady
                    }
                });
            } else {
                player.loadVideoById(videoObj.id);
            }
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                currentIndex++;
                if (currentIndex < queuePlaylist.length) {
                    playVideo(queuePlaylist[currentIndex], currentIndex);
                } else {
                    currentIndex = 0;
                    playVideo(queuePlaylist[currentIndex], currentIndex);
                }
            }
        }

        function renderPlaylistQueueUI() {
            const container = document.getElementById('playlist-queue-container');
            container.innerHTML = "";

            queuePlaylist.forEach((item, idx) => {
                const pItem = document.createElement('div');
                pItem.className = `playlist-item ${idx === currentIndex ? 'active' : ''}`;
                pItem.innerHTML = `
                    <div class="playlist-item-left">
                        <img src="${item.thumb}" alt="">
                        <div style="overflow: hidden;">
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;">${item.title}</div>
                            <div style="color: #aaa; font-size: 10px;">${item.channel}</div>
                        </div>
                    </div>
                `;
                pItem.addEventListener('click', () => {
                    recordVideoWatch(item);
                    playVideo(item, idx);
                });
                container.appendChild(pItem);
            });
        }

        async function searchYouTube(query) {
            if (!query.trim()) return;
            
            recordSearchKeyword(query);

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${YT_API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.items) {
                    const searchResults = data.items.map(item => ({
                        id: item.id.videoId,
                        title: item.snippet.title,
                        channel: item.snippet.channelTitle,
                        category: query,
                        thumb: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                    }));
                    currentVideosList = searchResults;

                    showView('home');
                    document.getElementById('home-section-title').innerText = `Hasil Pencarian: "${query}"`;
                    
                    const plContainer = document.getElementById('custom-playlist-wrapper');
                    if (plContainer) plContainer.innerHTML = "";

                    const grid = document.getElementById('video-grid');
                    grid.className = "video-grid";
                    grid.innerHTML = "";

                    searchResults.forEach((vid, index) => {
                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.innerHTML = `
                            <div class="thumbnail-container">
                                <img src="${vid.thumb}" alt="${vid.title}">
                            </div>
                            <div class="video-info">
                                <div style="display:flex; gap:8px; overflow:hidden;">
                                    <div style="width:28px; height:28px; background:#555; border-radius:50%; flex-shrink:0;"></div>
                                    <div class="video-details">
                                        <h3>${vid.title}</h3>
                                        <p>${vid.channel}</p>
                                    </div>
                                </div>
                                <button class="btn-options" title="Opsi" onclick="event.stopPropagation(); openAddToPlaylistModal('${vid.id}')">
                                    <i class="fas fa-ellipsis-vertical"></i>
                                </button>
                            </div>
                        `;
                        card.addEventListener('click', () => {
                            recordVideoWatch(vid);
                            queuePlaylist = searchResults;
                            playVideo(vid, index);
                        });
                        grid.appendChild(card);
                    });

                }
            } catch (error) {
                console.error("Gagal melakukan pencarian:", error);
            }
        }

        document.getElementById('search-submit').addEventListener('click', () => {
            searchYouTube(searchInput.value);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchYouTube(e.target.value);
            }
        });

        renderHomeView();
    </script>
</body>
