<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk Interaktif</title>
    <!-- Menggunakan Font Poppins agar tampilan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            padding: 30px 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 8px;
        }

        header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        /* Responsive Grid untuk Kartu Produk */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        /* Desain Kartu Produk */
        .product-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            border: 1px solid #e2e8f0;
        }

        /* Efek Hover saat mouse diarahkan ke barang */
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        }

        .img-container {
            width: 100%;
            height: 210px;
            overflow: hidden;
            background-color: #f1f5f9;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .img-container img {
            transform: scale(1.08);
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .product-price {
            font-size: 1rem;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 16px;
        }

        .badge-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #eff6ff;
            color: #2563eb;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px;
            border-radius: 10px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .product-card:hover .badge-link {
            background-color: #2563eb;
            color: #ffffff;
        }

        /* Responsif untuk layar HP kecil */
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }
            .img-container {
                height: 150px;
            }
            .product-info {
                padding: 12px;
            }
            .product-title {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ALMA SHOP</h1>
            <h2>Katalog Produk</h2>
            <p>Klik pada gambar atau nama barang untuk membuka tautan</p>
        </header>

        <!-- Container Grid Produk -->
        <main class="product-grid" id="productGrid"></main>
    </div>

    <script>
        // Data Produk (Anda bisa menambah atau mengganti data di sini)
        const products = [
            {
                name: "Sepatu Sneakers Casual",
                price: "Rp 0",
                image: "IMG_01.jpg",
                url: "https://tiktok.co.id" // Gantilah dengan link tujuan Anda
            },
            {
                name: "Jam Tangan Minimalis Modern",
                price: "Rp 0",
                image: "IMG_02.jpg",
                url: "https://tokopedia.com"
            },
            {
                name: "Headphone Wireless Bass",
                price: "Rp 0",
                image: "IMG_03.jpg",
                url: "https://tiktok.com"
            },
            {
                name: "Kamera Mirrorless",
                price: "Rp 0",
                image: "IMG_04.jpg",
                url: "https://tiktok.com"
            },
            {
                name: "Kaos Musim Panas Unisex untuk Anak Laki-laki dan Perempuan, leher bulat, longgar, lengan pendek, sederhana dan ramah kulit, sehat dan ramah lingkungan, cetakan modis lengan pendek baru, cocok untuk tinggi 90-150cm, usia 3-15 tahun. ",
                price: "Rp 0",
                image: "IMG_08.jpg",
                url: "https://vt.tokopedia.com/t/ZS9h7k1jVxt8t-TW1Qq/"
            },
            {
                name: "Setelan Jeans Anak Almont Stripe Usia 1-6 Tahun Laki-laki dan Perempuan Motif Salur Kombinasi-Outfit Kasual One Set Katun Parsel ",
                price: "Rp 0",
                image: "IMG_07.jpg",
                url: "https://vt.tokopedia.com/t/ZS9h7rpxWC1hx-Uy6w2/"
            }
        ];

        // Fungsi JavaScript untuk me-render produk ke HTML
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            products.forEach(item => {
                // Membuat elemen link wrapping seluruh kartu barang
                const card = document.createElement('a');
                card.className = 'product-card';
                card.href = item.url;
                card.target = '_blank'; // Membuka link di tab baru
                card.rel = 'noopener noreferrer';

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${item.image}" alt="${item.name}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div>
                            <h2 class="product-title">${item.name}</h2>
                            <p class="product-price">${item.price}</p>
                        </div>
                        <div class="badge-link">
                            <span>Beli Sekarang</span>
                            <span>&rarr;</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Jalankan fungsi ketika halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', renderProducts);
    </script>
</body>
</html>
